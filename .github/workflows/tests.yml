name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: watchrr
          POSTGRES_PASSWORD: watchrr
          POSTGRES_DB: watchrr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://watchrr:watchrr@localhost:5432/watchrr

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Migrations
        run: npm run db:migrate

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Post coverage comment
        if: success() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.8.3
        with:
          json-summary-path: coverage/coverage-summary.json

  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create CI env file
        run: |
          {
            echo 'DB_PASSWORD=watchrr'
            echo 'AUTH_JWT_SECRET=ci-dummy-jwt-secret'
            echo 'THEMOVIEDB_ACCESS_TOKEN=ci-dummy-tmdb-token'
            echo 'CRON_SECRET=test-secret'
            echo 'APP_IMAGE=watchrr:ci'
          } > .env

      - name: Build and start Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait

      - name: Smoke test health endpoint
        run: curl -sf http://localhost:3000/health | grep -q ok

      - name: Smoke test sign-in page
        run: curl -sf http://localhost:3000/signin | grep -q '<'

      - name: Smoke test /api/refresh auth
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/refresh)
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer test-secret" http://localhost:3000/api/refresh)
          test "$code" != "401"

      - name: Verify migrations applied
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres \
            psql -U watchrr -d watchrr -c '\dt' | grep -q users

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
