name: Tag new npm package releases

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  tag-npm-release:
    name: Tag NPM package releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # PAT so the tag push triggers other workflows (GITHUB_TOKEN suppresses them).
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0

      - uses: neverendingqs/gh-action-tag-on-npm-version@8d976f6bcb00359278133f293bc1ee00c152bb60 # v1.0.0
