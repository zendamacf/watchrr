name: PR Linting

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Pinned to 22 for consistency with pr-tests.yml (see comment there).
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint

      - name: Typescript
        run: npm run typecheck
