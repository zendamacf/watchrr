name: PR E2E Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    name: setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  e2e:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}-e2e
          api_key: ${{ secrets.NEON_API_KEY }}
          database: watchrr

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=${{ steps.create-branch.outputs.db_url_pooled }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 25
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Migrations
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          AUTH_JWT_SECRET: test-jwt-secret
          THEMOVIEDB_ACCESS_TOKEN: test-tmdb-token

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Post Playwright results to PR
        if: always()
        uses: daun/playwright-report-summary@v3
        with:
          report-file: playwright-report/results.json
          report-tag: e2e
          comment-title: E2E test results
